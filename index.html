<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>HirePlay</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-canvas {
            display: block;
            background: #231F20;
        }

        #carregando {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 22px;
            background: #000;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="carregando">Carregando... 0%</div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/HirePlayWeb.loader.js"></script>
    <script>
    // true  = mant�m a propor��o do jogo (faixas pretas nas sobras)
    // false = estica o jogo para ocupar a janela inteira
    var MANTER_PROPORCAO = true;
    var PROPORCAO = 16 / 10; // largura / altura do jogo (960x600)

    var canvas = document.getElementById("unity-canvas");
    var aviso = document.getElementById("carregando");

    function ajustar() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      if (!MANTER_PROPORCAO) {
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        return;
      }
      var cw = w;
      var ch = w / PROPORCAO;
      if (ch > h) { ch = h; cw = h * PROPORCAO; }
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
    }
    window.addEventListener("resize", ajustar);
    window.addEventListener("orientationchange", ajustar);
    ajustar();

    createUnityInstance(canvas, {
      dataUrl: "Build/HirePlayWeb.data",
      frameworkUrl: "Build/HirePlayWeb.framework.js",
      codeUrl: "Build/HirePlayWeb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "HirePlay",
      productVersion: "1.0"
    }, function (progresso) {
      aviso.textContent = "Carregando... " + Math.round(progresso * 100) + "%";
    }).then(function () {
      aviso.style.display = "none";
      canvas.focus();
    }).catch(function (erro) {
      aviso.textContent = "Erro ao carregar o jogo: " + erro;
    });
    </script>
</body>
</html>
